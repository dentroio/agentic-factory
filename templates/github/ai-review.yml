# =============================================================================
# ai-review.yml — Claude AI Code Review (blocking)
#
# Runs on every PR opened or updated against main. Posts a structured review
# comment and decides the check's colour from the verdict in it.
#
# Verdict logic:
#   "Review required" → job exits 1, merge is blocked
#   "Needs attention" → comment posted, merge allowed (advisory only)
#   "LGTM"            → comment posted, merge allowed
#   no verdict at all → job exits 1. A review that did not happen is not a
#                       review that passed. Everything below is arranged so
#                       that this is the default, not a case someone has to
#                       remember to handle.
#
# Cost: ~7K tokens/review × claude-sonnet-4-6 ≈ $0.02–0.05/PR
# Setup: add ANTHROPIC_API_KEY as a repository Actions secret.
#
# ── Why there is no longer a "skip" step ─────────────────────────────────────
# This job used to short-circuit on the HEAD commit message: auto-generated
# commits ([pr-watch-fix], [ai-review-apply], [ci-autofix]) and GitHub's
# "Update branch" merge commits set skip=true, every reviewing step was
# conditioned on skip != 'true', and the only step that could fail the job was
# conditioned on the review's outcome. Skipping therefore left the job green —
# a passing required check with no verdict behind it.
#
# Two things were wrong with it, and only one of them was the obvious one:
#
#   1. Skip meant pass. Any commit that matched turned the gate green.
#   2. It never actually matched. On a pull_request event actions/checkout
#      checks out refs/pull/N/merge, so `git log -1` reads GitHub's synthetic
#      merge commit ("Merge <head-sha> into <base-sha>"), not the PR's own HEAD
#      commit. That message carries no [marker] and does not match
#      `^Merge branch '...' into ...$`, so the branch was dead code. The
#      token-saving it promised was never delivered, and the bypass it opened
#      was one `ref:` line away from being live.
#
# Deleting it costs nothing that was working. What it was meant to avoid —
# paying to re-review unchanged content after an "Update branch" click — is
# already handled by diffing three-dot against the base below: merging main
# into the PR branch does not change `origin/main...HEAD` unless main touched
# the same lines, in which case the diff really is different and a re-review
# is the correct outcome, not a waste.
# =============================================================================

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job-level exemption, and it is a physical one rather than a
    # policy one: a pull_request event from dependabot gets a read-only token
    # and no secrets, so ANTHROPIC_API_KEY is not available and the review
    # cannot run at all. Dependency bumps are triaged by dependabot-wo-bridge.yml.
    # A skipped job counts as a pass for branch protection, so any new
    # condition added here is a new way to be green without a review —
    # tests/unit/test_ai_review_gate_fails_closed.py fails if one appears.
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout trusted scripts from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
          path: trusted-scripts
          persist-credentials: false

      - name: Collect the PR's cumulative diff
        id: diff
        run: |
          # Three-dot: everything this PR adds on top of its base, not the
          # HEAD commit's own diff. That is what is being merged, and it is
          # stable across "Update branch" merges of main into the branch.
          #
          # Filtered by exclusion, never by an allow-list of extensions. An
          # allow-list silently drops whatever nobody thought to add — this
          # one listed source languages, so a PR touching only Dockerfiles,
          # Vault .hcl, JSON config or a .js file produced an empty diff, and
          # an empty diff skipped straight past the reviewer to a green check.
          # It also missed templates, workflows, Makefiles and shell scripts —
          # on #195 the reviewer downgraded its own verdict because the
          # Makefile the PR was about wasn't in the diff. Excluding known-inert
          # files instead means every other file type is reviewed by default,
          # and an empty diff really does mean "nothing here to review". Safe
          # now that ai_review.py chunks large diffs.
          git diff origin/main...HEAD -- . \
            ':!**/node_modules/**' ':!**/vendor/**' ':!**/dist/**' \
            ':!**/*.min.*' ':!**/package-lock.json' ':!**/*.lock' \
            ':!**/*.md' \
            ':!**/*.png' ':!**/*.jpg' ':!**/*.jpeg' ':!**/*.gif' \
            ':!**/*.svg' ':!**/*.ico' ':!**/*.pdf' \
            > /tmp/pr_diff.txt
          echo "lines=$(wc -l < /tmp/pr_diff.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

          {
            echo "### Files changed in this PR"
            echo '```'
            git diff --name-only origin/main...HEAD
            echo '```'
            echo "Reviewable diff: $(wc -l < /tmp/pr_diff.txt | tr -d ' ') lines"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: success() && steps.diff.outputs.lines != '0'
        with:
          python-version: "3.11"

      - name: Run Claude review
        id: claude_review
        if: success() && steps.diff.outputs.lines != '0'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pip install anthropic --quiet
          python3 trusted-scripts/scripts/ai_review.py \
            --diff /tmp/pr_diff.txt \
            --output /tmp/review.md

      - name: Post review comment
        if: success() && steps.diff.outputs.lines != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const blocked = '${{ steps.claude_review.outcome }}' === 'failure';
            // ai_review.py has `continue-on-error: true` on the step above, so a
            // crash there (rate limit, API error, a bug in the script itself —
            // not necessarily "found blocking issues") doesn't fail the job
            // outright, it just leaves /tmp/review.md missing. Reading it
            // unconditionally then crashed *this* step too, with an opaque
            // ENOENT instead of surfacing what actually went wrong — same
            // "missing file means silence, not a clear error" gap already
            // fixed in observability.yml. Either way the verdict step below
            // still fails the job; this only decides what the comment says.
            const reviewFileExists = fs.existsSync('/tmp/review.md');
            const review = reviewFileExists
              ? fs.readFileSync('/tmp/review.md', 'utf8')
              : 'The review script exited without producing output — it likely crashed ' +
                '(API error, rate limit, or a bug in ai_review.py) rather than finding ' +
                'blocking issues. Check the workflow run logs for the actual error.';
            const header = blocked
              ? (reviewFileExists
                  ? '## 🤖 AI Code Review — ❌ Review Required (merge blocked)'
                  : '## 🤖 AI Code Review — ⚠️ Review script failed to run')
              : '## 🤖 AI Code Review';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${header}\n\n${review}\n\n---\n*Generated by Claude claude-sonnet-4-6*`
            });

      - name: Enforce the review verdict
        # Runs whatever happened above, and denies by default. Every earlier
        # step can be skipped; this one decides the check, and it only exits 0
        # on a state it recognises as reviewed. The previous shape — a final
        # step conditioned on the review having failed — meant every path that
        # never reached the reviewer ended green.
        if: ${{ !cancelled() }}
        env:
          REVIEW_OUTCOME: ${{ steps.claude_review.outcome }}
          DIFF_LINES: ${{ steps.diff.outputs.lines }}
        run: |
          if [ "$DIFF_LINES" = "0" ]; then
            echo "No reviewable changes — this PR touches only docs, images or lockfiles."
            echo "Nothing was sent to the reviewer because there is no code in it."
            exit 0
          fi

          case "$REVIEW_OUTCOME" in
            success)
              echo "AI review verdict: LGTM or Needs attention — merge can proceed"
              exit 0
              ;;
            failure)
              echo "AI review verdict: Review required, or the review could not run — blocking merge" >&2
              exit 1
              ;;
            *)
              echo "The reviewer never produced a verdict for this PR (diff lines: '${DIFF_LINES:-unknown}'," >&2
              echo "review step outcome: '${REVIEW_OUTCOME:-did not run}'). Failing closed: an unreviewed" >&2
              echo "change is not an approved one. Check the earlier steps in this job for the cause." >&2
              exit 1
              ;;
          esac

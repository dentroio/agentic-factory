name: Doc Writer — Update Product + Factory Wikis

# Runs once daily and on-demand.
# Job 1: Updates product wiki pages when vars.CLARION_REPO is set (optional;
#         do NOT default to a private product — stranger forks must skip this job)
# Job 2: Updates factory's own wiki pages (docs/wiki/) — self-maintenance
#
# Cost note (2026-07-30): each page costs ~$0.10-0.20 (stuffs up to 5 WO specs,
# up to 64KB each, into context) — and that cost is paid even when Claude
# decides no change is needed. max-pages defaults to 2/run and the schedule is
# daily to cap spend.
#
# Secrets required (set on dentroio/agentic-factory):
#   ANTHROPIC_API_KEY  — Claude API key
#   GH_PAT             — PAT with contents:write on the product wiki repo (if used)
#
# Variables (optional):
#   CLARION_REPO       — product wiki repo (e.g. dentroio/clarion). Unset = skip job 1.
#   DOC_WRITER_MAX_PAGES — default: 2
#   ANTHROPIC_MODEL    — default: claude-sonnet-5 (script's own fallback).

on:
  schedule:
    - cron: "0 0 * * *"    # once daily — see docs/wiki/Doc-Writer-Agent.md for cost rationale
  workflow_dispatch:
    inputs:
      page:
        description: "Update a specific page (relative to wiki/docs/, e.g. operator/secure/groups.md)"
        required: false
      max_pages:
        description: "Max pages to update (default 5)"
        required: false
        default: "5"
      dry_run:
        description: "Dry run — show what would change without writing"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-clarion-wiki:
    name: Update product wiki
    if: ${{ vars.CLARION_REPO != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout agentic-factory
        uses: actions/checkout@v4

      - name: Checkout product repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CLARION_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: clarion

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install anthropic

      - name: Run doc writer (product wiki)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          ARGS="--clarion-path ./clarion --max-pages ${{ inputs.max_pages || vars.DOC_WRITER_MAX_PAGES || '2' }}"

          if [ -n "${{ inputs.page }}" ]; then
            ARGS="$ARGS --page ${{ inputs.page }}"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          python3 scripts/doc_writer.py $ARGS

      - name: Commit and push product wiki updates
        if: ${{ inputs.dry_run != 'true' }}
        working-directory: clarion
        run: |
          git config user.name  "factory-doc-writer[bot]"
          git config user.email "noreply@dentroio.com"
          git add wiki/docs/

          if git diff --cached --quiet; then
            echo "No product wiki changes to commit."
            exit 0
          fi

          # frontend/public/help/ is a committed mirror of wiki/docs/ (rsync --delete,
          # regenerated on every `npm run build` via a prebuild hook). Re-sync and commit
          # it in the SAME commit as the wiki update so it never drifts.
          if [ -x frontend/scripts/sync_in_app_help.sh ]; then
            bash frontend/scripts/sync_in_app_help.sh
            git add frontend/public/help/ || true
          fi

          CHANGED=$(git diff --cached --name-only | grep "^wiki/docs/" | sed 's|wiki/docs/||' | tr '\n' ', ' | sed 's/,$//' || true)
          git commit -m "docs(wiki): auto-update ${CHANGED} [doc-writer-agent]

          Updated by the AI Factory doc-writer agent.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ vars.CLARION_REPO }}.git HEAD:main

  update-factory-wiki:
    name: Update factory wiki (self)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout agentic-factory
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install anthropic

      - name: Run doc writer (factory)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          ARGS="--factory-path . --max-pages ${{ inputs.max_pages || vars.DOC_WRITER_MAX_PAGES || '2' }}"

          if [ -n "${{ inputs.page }}" ]; then
            ARGS="$ARGS --page ${{ inputs.page }}"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          python3 scripts/doc_writer.py $ARGS

      - name: Open PR with factory wiki updates
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name  "factory-doc-writer[bot]"
          git config user.email "noreply@dentroio.com"
          git add docs/wiki/

          if git diff --cached --quiet; then
            echo "No factory wiki changes to commit."
            exit 0
          fi

          # main requires a PR (repo ruleset) — a direct push here always gets rejected.
          CHANGED=$(git diff --cached --name-only | grep "^docs/wiki/" | sed 's|docs/wiki/||' | tr '\n' ', ' | sed 's/,$//')
          BRANCH="doc-writer/factory-wiki-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "docs(wiki): auto-update factory wiki ${CHANGED} [doc-writer-agent]

          Updated by the AI Factory doc-writer agent (self-maintenance).
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "docs(wiki): auto-update factory wiki ${CHANGED}" \
            --body "Automated update by the doc-writer agent (self-maintenance).

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --base main --head "$BRANCH")
          echo "Opened $PR_URL"

          # required_approving_review_count is 0 — only the Unit Tests status check
          # gates merge. This push/PR is authored by GH_PAT (a real user identity),
          # so the normal pull_request-triggered CI run fires on its own.
          for i in $(seq 1 20); do
            sleep 15
            BUCKET=$(gh pr checks "$PR_URL" --json name,bucket -q '.[] | select(.name=="Unit Tests") | .bucket' 2>/dev/null || echo "")
            if [ "$BUCKET" = "pass" ]; then
              gh pr merge "$PR_URL" --squash --delete-branch
              exit 0
            fi
            if [ "$BUCKET" = "fail" ]; then
              echo "Unit Tests failed on $PR_URL — leaving PR open for review."
              exit 0
            fi
          done
          echo "Unit Tests didn't complete in time — leaving $PR_URL open for review."

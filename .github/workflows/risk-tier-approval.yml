# =============================================================================
# risk-tier-approval.yml — Enforce human approval for P0/P1 WOs (AF-01)
#
# The ruleset's own required_approving_review_count is 0 and applies
# uniformly to every PR — raising it would block P2/P3's documented
# auto-merge-after-CI flow just as hard as an unreviewed P0/P1 merge. This
# workflow is the tier-aware alternative: it reads the WO's own declared
# risk tier (from its spec file's Priority field) and only requires a human
# APPROVED review when that tier is P0 or P1. P2/P3 pass immediately, same
# as branches with no associated WO spec at all (hotfixes, dependency bumps).
#
# Re-runs on every review submission and on label changes, so approving a PR
# (or adding `risk-tier-approved`, which GitHub allows on your own PR) flips
# this check green without needing a new commit.
#
# Do not cancel in-progress runs. GitHub required checks treat CANCELLED as
# blocking, so an opened+labeled race (PR #224) left merge BLOCKED even though
# the surviving run was green. Both runs must be allowed to finish; the script
# retries the label lookup so `opened` absorbs create-then-label.
# =============================================================================

name: Risk Tier Approval Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: risk-tier-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check:
    name: Risk Tier Approval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request_review otherwise checks out the default branch, so a
          # P0 spec that only exists on the PR would be "not found" and the
          # gate would pass without checking for an approval.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check risk-tier approval requirement
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_risk_tier_approval.py

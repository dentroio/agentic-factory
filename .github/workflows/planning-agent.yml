# =============================================================================
# planning-agent.yml — WO Spec Drafting
#
# Triggered when a GitHub issue carries the 'new-wo' label — either added to an
# existing issue, or present at creation (needs both trigger types: GitHub's
# `labeled` webhook only fires for the former; an issue opened with the label
# already attached only emits `opened`, never a separate `labeled` event. The
# Dependabot->WO bridge creates issues with labels in one API call, so it hits
# exactly this case — missed here for the bridge's entire history until fixed
# 2026-07-30, confirmed via `gh run list` showing zero runs ever on Clarion,
# the repo actually running this bridge).
#
# Calls planning_agent.py to draft a WO spec and opens a PR for human review.
#
# The agent drafts; a human reviews and adjusts risk tier and AC before merging.
#
# Setup:
#   1. Add ANTHROPIC_API_KEY as a repository Actions secret
#   2. Add WO_SPECS_DIR as a repository variable (default: docs/project_management/work_orders)
#   3. Add a 'new-wo' label to your repo (Settings → Labels)
# =============================================================================

name: Planning Agent — Draft WO Spec

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  draft-wo-spec:
    name: Draft WO Spec
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'new-wo') ||
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'new-wo'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine next WO number
        id: wo_num
        env:
          WO_DIR: ${{ vars.WO_SPECS_DIR || 'docs/project_management/work_orders' }}
        run: |
          # Find highest existing WO number
          LAST=$(ls "$WO_DIR"/WO-*.md 2>/dev/null | grep -oP 'WO-\K\d+' | sort -n | tail -1)
          NEXT=$((${LAST:-0} + 1))
          echo "next=$NEXT" >> $GITHUB_OUTPUT
          echo "Next WO number: $NEXT"

      - name: Draft WO spec
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          WO_NUM: ${{ steps.wo_num.outputs.next }}
          WO_DIR: ${{ vars.WO_SPECS_DIR || 'docs/project_management/work_orders' }}
        run: |
          pip install anthropic --quiet
          SLUG=$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | \
                 sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | cut -c1-50)
          OUTPUT="$WO_DIR/WO-$(printf '%03d' "$WO_NUM")-${SLUG}.md"
          echo "output=$OUTPUT" >> $GITHUB_OUTPUT

          python3 scripts/planning_agent.py \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY" \
            --next-wo-num "$WO_NUM" \
            --output "$OUTPUT"

      - name: Open PR with WO spec
        uses: actions/github-script@v7
        env:
          DRAFT_OUTPUT: ${{ steps.draft.outputs.output }}
          WO_NUM: ${{ steps.wo_num.outputs.next }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const { execSync } = require('child_process');
            const output = process.env.DRAFT_OUTPUT;
            const woNum = process.env.WO_NUM;
            const issueTitle = process.env.ISSUE_TITLE;
            const issueNumber = process.env.ISSUE_NUMBER;
            const branch = `wo/${woNum.padStart(3, '0')}-spec-draft`;

            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');

            execSync(`git checkout -b ${branch}`);
            execSync(`git add "${output}"`);
            execSync(`git commit -m "docs(wo): draft WO-${woNum.padStart(3, '0')} spec from issue #${issueNumber}"`);
            execSync(`git push origin ${branch}`);

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `docs(wo): WO-${woNum.padStart(3, '0')} — ${issueTitle}`,
              body: `## WO Spec Draft\n\nAuto-drafted from issue #${issueNumber}.\n\n**Review checklist before merging:**\n- [ ] Risk tier is correct (P0/P1 → human merge, P2 → auto-merge, P3 → PR with auto-merge)\n- [ ] Acceptance criteria are verifiable (not vague)\n- [ ] Branch name and PR title in \`## Execution\` section are correct\n- [ ] Files to touch list is accurate\n\nOnce merged, an agent can pick this up by reading the \`## Execution\` section.\n\nCloses #${issueNumber}`,
              head: branch,
              base: 'main',
            });

            console.log(`PR opened: ${pr.data.html_url}`);

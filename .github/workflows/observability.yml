# =============================================================================
# observability.yml — Scheduled Health Check → Anomaly → WO Issue
#
# Polls your health/metrics endpoint every 15 minutes. If an anomaly is
# detected, creates a GitHub issue labeled 'new-wo' — which triggers the
# planning agent to draft a WO spec for the incident.
#
# This closes the full SDLC loop:
#   production anomaly → GitHub issue → WO spec → implementation → merge
#
# Setup:
#   1. Add METRICS_ENDPOINT as a repository variable (required)
#   2. Add ANTHROPIC_API_KEY as a repository Actions secret
#   3. Optionally add scripts/observability_thresholds.json to your repo
# =============================================================================

name: Observability — Health Check

on:
  schedule:
    - cron: "*/15 * * * *"   # Every 15 minutes
  workflow_dispatch:           # Manual trigger for testing

permissions:
  issues: write
  contents: read

# Runs every 15 minutes with no cancellation — a run that takes longer than
# that (e.g. a slow health endpoint) stacks with the next one instead of
# being superseded by it. One global group since every run checks the same
# endpoint; there's never a legitimate reason for two to run concurrently.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The docs (Customization.md) promise this workflow "skips silently"
      # when METRICS_ENDPOINT isn't set. Nothing enforced that — every step
      # below ran anyway, observability_agent.py crashed on
      # urllib.request.Request(""), and the failure handler filed an
      # incident issue. With no endpoint ever configured, that fired every
      # 15 minutes for 4 days straight (79 duplicate issues, see #97-#202).
      - name: Check endpoint configured
        id: config
        run: |
          if [ -z "${{ vars.METRICS_ENDPOINT }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.config.outputs.configured == 'true'
        with:
          python-version: "3.11"

      - name: Run observability agent
        id: obs
        if: steps.config.outputs.configured == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          pip install anthropic --quiet
          python3 scripts/observability_agent.py \
            --endpoint "${{ vars.METRICS_ENDPOINT }}" \
            --thresholds scripts/observability_thresholds.json \
            --output /tmp/anomaly.md

      - name: Create incident issue
        if: steps.config.outputs.configured == 'true' && steps.obs.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const now = new Date().toISOString();

            // "outcome == failure" means the script exited non-zero — that's
            // true both when it found a real anomaly and wrote the report,
            // AND when it crashed before ever writing one (missing config,
            // network error, a bug in the script itself). Reading the file
            // unconditionally crashed this step outright on the second case
            // (ENOENT), which is worse than a wrong report: it drops the
            // failure entirely instead of surfacing it.
            let report;
            let anomalyFileExists = fs.existsSync('/tmp/anomaly.md');
            if (anomalyFileExists) {
              report = fs.readFileSync('/tmp/anomaly.md', 'utf8');
            } else {
              report = 'The observability agent exited with a failure but did not produce ' +
                       'an anomaly report — it likely crashed before writing one (missing ' +
                       'config, network error, or a bug in observability_agent.py). Check the ' +
                       'workflow run logs for the actual error.';
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: anomalyFileExists
                ? `[Incident] Anomaly detected at ${now}`
                : `[Incident] Observability agent failed to run at ${now}`,
              body: `${report}\n\n---\n*Detected by observability agent. Label this issue \`new-wo\` to have the planning agent draft a WO spec.*`,
              labels: ['incident', 'needs-triage'],
            });

            console.log(`Incident issue created: ${issue.data.html_url}`);

      - name: Annotate run on anomaly
        if: steps.config.outputs.configured == 'true' && steps.obs.outcome == 'failure'
        run: |
          echo "::error::Anomaly detected — see GitHub issue for details"
          exit 1
